name: "Build Amiberry Android APK"

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'Release'
        type: choice
        options:
          - 'Release'
          - 'Debug'
      enable_jit:
        description: 'Enable ARM64 JIT Compilation'
        required: true
        default: true
        type: boolean
  push:
    branches:
      - master
      - master
      - main
      - preview

jobs:
  build-android-arm64:
    name: "Compile Amiberry for Android (arm64-v8a)"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Amiberry Repository & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK (25.2.9519653) & Build Tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libxml2-dev libpng-dev libmpg123-dev libflac-dev

      - name: "Apply Android Compatibility Patches (Headers & AndroidManifest)"
        shell: python
        run: |
          import os, glob, re

          # 1. Fix missing <unordered_map> in amiberry.cpp
          if os.path.exists('src/osdep/amiberry.cpp'):
              with open('src/osdep/amiberry.cpp', 'r') as f:
                  content = f.read()
              if '#include <unordered_map>' not in content:
                  with open('src/osdep/amiberry.cpp', 'w') as f:
                      f.write('#include <unordered_map>
#include <functional>
' + content)
                  print('Patched amiberry.cpp with <unordered_map>')

          # 2. Fix posix_spawn in amiberry_update.cpp by replacing spawn.h with safe Android stubs
          if os.path.exists('src/osdep/amiberry_update.cpp'):
              with open('src/osdep/amiberry_update.cpp', 'r') as f:
                  content = f.read()
              target = '#include <spawn.h>'
              stub = '#if !defined(__ANDROID__)
#include <spawn.h>
#else
static inline int posix_spawn(...) { return -1; }
static inline int posix_spawnp(...) { return -1; }
#endif'
              if target in content:
                  content = content.replace(target, stub)
              else:
                  content = stub + '
' + content
              with open('src/osdep/amiberry_update.cpp', 'w') as f:
                  f.write(content)
              print('Patched amiberry_update.cpp with posix_spawn stub')

          # 3. Patch AndroidManifest.xml for Android 12+ (Tab S8 One UI requires android:exported on activities with intent-filters)
          manifests = glob.glob('**/AndroidManifest.xml', recursive=True)
          for m_path in manifests:
              if 'build' in m_path:
                  continue
              with open(m_path, 'r') as f:
                  m_content = f.read()
              modified = False
              if '<intent-filter>' in m_content and 'android:exported=' not in m_content:
                  m_content = re.sub(r'(<activity(?![^>]*android:exported=))', r'\1 android:exported="true"', m_content)
                  modified = True
              if 'android:extractNativeLibs=' not in m_content and '<application' in m_content:
                  m_content = re.sub(r'(<application)', r'\1 android:extractNativeLibs="true"', m_content)
                  modified = True
              if modified:
                  with open(m_path, 'w') as f:
                      f.write(m_content)
                  print(f'Patched Android 12+ exported attributes in {m_path}')

      - name: "Configure CMake Native Toolchain"
        env:
          INPUT_BUILD_TYPE: ${{ inputs.build_type }}
          INPUT_ENABLE_JIT: ${{ inputs.enable_jit }}
        run: |
          BUILD_TYPE="${INPUT_BUILD_TYPE:-Release}"
          ENABLE_JIT="ON"
          if [ "$INPUT_ENABLE_JIT" = "false" ]; then
            ENABLE_JIT="OFF"
          elif [ "$INPUT_ENABLE_JIT" = "true" ]; then
            ENABLE_JIT="ON"
          fi

          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653
          cmake -B build-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DUSE_JIT=$ENABLE_JIT \
            -DARM64_JIT=ON \
            -DENABLE_AUTO_UPDATE=OFF \
            -DCMAKE_OBJECT_PATH_MAX=1024 \
            -DUSE_OPENGL=ON \
            -DUSE_SDL2=ON

      - name: "Compile Native C++ Amiberry Core"
        env:
          INPUT_BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          BUILD_TYPE="${INPUT_BUILD_TYPE:-Release}"
          cmake --build build-android --config $BUILD_TYPE -j$(nproc)

      - name: Stage Runtime Assets into Android Project (Fonts, Data, Configs)
        run: |
          echo "Staging Amiberry data assets into Android APK assets directory..."
          ASSETS_DIR="android/app/src/main/assets"
          if [ ! -d "android/app" ] && [ -d "app" ]; then
            ASSETS_DIR="app/src/main/assets"
          fi
          mkdir -p "$ASSETS_DIR"
          
          # Copy Amiberry essential runtime files if present
          [ -d "data" ] && cp -r data "$ASSETS_DIR/" || true
          [ -d "conf" ] && cp -r conf "$ASSETS_DIR/" || true
          [ -f "amiberry.png" ] && cp amiberry.png "$ASSETS_DIR/" || true
          echo "Assets staged into $ASSETS_DIR"

      - name: Assemble Android APK Packages (Debug & Release)
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653
          GRADLE_DIR="."
          if [ -f "./android/gradlew" ]; then
            GRADLE_DIR="./android"
          fi
          
          cd $GRADLE_DIR
          chmod +x gradlew
          
          echo "Building signed Debug APK (with full JNI logcat logging enabled)..."
          ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a --no-daemon || ./gradlew assembleDebug --no-daemon
          
          echo "Building Release APK..."
          ./gradlew assembleRelease -Pandroid.injected.build.abi=arm64-v8a --no-daemon || ./gradlew assembleRelease --no-daemon
          cd -

      - name: Package & Verify Installable APKs for Samsung Galaxy Tab S8
        run: |
          mkdir -p build_output_apks
          
          # Find Android Build Tools apksigner & zipalign
          BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools/ -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"
          
          # Ensure keystore exists for signing
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # 1. Process Debug APK (Gradle already signed this)
          DEBUG_APK=$(find . -path "*/outputs/apk/debug/*.apk" 2>/dev/null | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "Found Debug APK: $DEBUG_APK"
            cp "$DEBUG_APK" build_output_apks/Amiberry-arm64-TabS8-Debug.apk
            $APKSIGNER verify --verbose build_output_apks/Amiberry-arm64-TabS8-Debug.apk || true
          fi
          
          # 2. Process Release APK (Align and sign with v2/v3 scheme)
          RELEASE_APK=$(find . -path "*/outputs/apk/release/*.apk" 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Found Release APK: $RELEASE_APK"
            $ZIPALIGN -p -f -v 4 "$RELEASE_APK" build_output_apks/temp-aligned.apk 2>/dev/null || cp "$RELEASE_APK" build_output_apks/temp-aligned.apk
            $APKSIGNER sign --ks ~/.android/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out build_output_apks/Amiberry-arm64-TabS8-Release.apk build_output_apks/temp-aligned.apk
            rm -f build_output_apks/temp-aligned.apk
            $APKSIGNER verify --verbose build_output_apks/Amiberry-arm64-TabS8-Release.apk || true
          fi
          
          # Fallback
          if [ -z "$(ls -A build_output_apks/*.apk 2>/dev/null)" ]; then
            find . -name "*.apk" -not -path "*/build_output_apks/*" -exec cp {} build_output_apks/ ;
          fi
          
          echo "=== Ready-to-Install Amiberry APKs for Samsung Galaxy Tab S8 ==="
          ls -la build_output_apks/

      - name: Upload Amiberry APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amiberry-arm64-samsung-tab-s8-apks
          path: build_output_apks/*.apk
          retention-days: 30
