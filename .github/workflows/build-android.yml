name: "Build Amiberry Android APK"

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'Release'
        type: choice
        options:
          - 'Release'
          - 'Debug'
      enable_jit:
        description: 'Enable ARM64 JIT Compilation'
        required: true
        default: true
        type: boolean
  push:
    branches:
      - master
      - master
      - main
      - preview

jobs:
  build-android-arm64:
    name: "Compile Amiberry for Android (arm64-v8a)"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Amiberry Repository & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK (25.2.9519653) & Build Tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libxml2-dev libpng-dev libmpg123-dev libflac-dev

      - name: "Apply Android Compatibility Patches"
        run: |
          # 1. Patch missing C++ headers in amiberry.cpp and sysdeps
          if [ -f "src/osdep/amiberry.cpp" ]; then
            echo "#include <unordered_map>" > temp_hdr.txt
            echo "#include <functional>" >> temp_hdr.txt
            echo "#include <string>" >> temp_hdr.txt
            cat src/osdep/amiberry.cpp >> temp_hdr.txt
            mv temp_hdr.txt src/osdep/amiberry.cpp
            echo "Patched src/osdep/amiberry.cpp"
          fi

          if [ -f "src/include/sysdeps.h" ]; then
            echo "#include <unordered_map>" > temp_sysdeps.txt
            echo "#include <functional>" >> temp_sysdeps.txt
            cat src/include/sysdeps.h >> temp_sysdeps.txt
            mv temp_sysdeps.txt src/include/sysdeps.h
            echo "Patched src/include/sysdeps.h"
          fi

          # 2. Provide posix_spawn stubs for Android in amiberry_update.cpp
          if [ -f "src/osdep/amiberry_update.cpp" ]; then
            echo "#include <unistd.h>" > temp_upd.txt
            echo "static inline int posix_spawn(void* a, const char* b, void* c, void* d, char* const e[], char* const f[]) { return -1; }" >> temp_upd.txt
            echo "static inline int posix_spawnp(void* a, const char* b, void* c, void* d, char* const e[], char* const f[]) { return -1; }" >> temp_upd.txt
            cat src/osdep/amiberry_update.cpp >> temp_upd.txt
            mv temp_upd.txt src/osdep/amiberry_update.cpp
            sed -i 's|<spawn.h>|<unistd.h>|g' src/osdep/amiberry_update.cpp 2>/dev/null || true
            echo "Patched src/osdep/amiberry_update.cpp with posix_spawn stub"
          fi

          # 3. Patch AndroidManifest.xml for Android 12+ (Samsung Tab S8 One UI)
          find . -name "AndroidManifest.xml" -not -path "*/build/*" | while read -r manifest; do
            if ! grep -q "android:exported=" "$manifest"; then
              sed -i 's/<activity /<activity android:exported="true" /g' "$manifest"
            fi
            if ! grep -q "android:extractNativeLibs=" "$manifest"; then
              sed -i 's/<application /<application android:extractNativeLibs="true" /g' "$manifest"
            fi
            echo "Patched $manifest"
          done

      - name: "Configure CMake Native Toolchain"
        env:
          INPUT_BUILD_TYPE: ${{ inputs.build_type }}
          INPUT_ENABLE_JIT: ${{ inputs.enable_jit }}
        run: |
          BUILD_TYPE="${INPUT_BUILD_TYPE:-Release}"
          ENABLE_JIT="ON"
          if [ "$INPUT_ENABLE_JIT" = "false" ]; then
            ENABLE_JIT="OFF"
          elif [ "$INPUT_ENABLE_JIT" = "true" ]; then
            ENABLE_JIT="ON"
          fi

          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653
          cmake -B build-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DUSE_JIT=$ENABLE_JIT \
            -DARM64_JIT=ON \
            -DENABLE_AUTO_UPDATE=OFF \
            -DCMAKE_OBJECT_PATH_MAX=1024 \
            -DUSE_OPENGL=ON \
            -DUSE_SDL2=ON

      - name: "Compile Native C++ Amiberry Core"
        env:
          INPUT_BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          BUILD_TYPE="${INPUT_BUILD_TYPE:-Release}"
          cmake --build build-android --config $BUILD_TYPE -j$(nproc)

      - name: "Stage Native Libraries & Runtime Assets into Android Project"
        run: |
          echo "Staging compiled ARM64 .so libraries into Android jniLibs..."
          mkdir -p android/app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/arm64-v8a
          find build-android -name "*.so" | while read -r so_file; do
            cp "$so_file" android/app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
            cp "$so_file" app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
            echo "Staged library: $so_file"
          done

          echo "Staging Amiberry data assets..."
          ASSETS_DIR="android/app/src/main/assets"
          if [ ! -d "android/app" ] && [ -d "app" ]; then
            ASSETS_DIR="app/src/main/assets"
          fi
          mkdir -p "$ASSETS_DIR"
          [ -d "data" ] && cp -r data "$ASSETS_DIR/" || true
          [ -d "conf" ] && cp -r conf "$ASSETS_DIR/" || true
          [ -f "amiberry.png" ] && cp amiberry.png "$ASSETS_DIR/" || true
          echo "Assets staged into $ASSETS_DIR"

      - name: "Assemble Android APK Packages (Debug & Release)"
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653
          GRADLE_DIR="."
          if [ -f "./android/gradlew" ]; then
            GRADLE_DIR="./android"
          fi

          cd $GRADLE_DIR
          chmod +x gradlew

          echo "Building Debug and Release APKs..."
          ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a --no-daemon || ./gradlew assembleDebug --no-daemon
          ./gradlew assembleRelease -Pandroid.injected.build.abi=arm64-v8a --no-daemon || ./gradlew assembleRelease --no-daemon
          cd -

      - name: "Align & Sign Installable APKs for Samsung Galaxy Tab S8"
        run: |
          mkdir -p build_output_apks

          # Find Android Build Tools apksigner & zipalign
          BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools/ -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

          # Ensure keystore exists for signing
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 1. Sign Debug APK
          RAW_DEBUG=$(find . -path "*/outputs/apk/debug/*debug*.apk" 2>/dev/null | head -n 1)
          if [ -n "$RAW_DEBUG" ] && [ -f "$RAW_DEBUG" ]; then
            echo "Processing Debug APK: $RAW_DEBUG"
            $ZIPALIGN -p -f -v 4 "$RAW_DEBUG" build_output_apks/temp_debug.apk
            $APKSIGNER sign --ks ~/.android/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out build_output_apks/Amiberry-v5-TabS8-Debug.apk build_output_apks/temp_debug.apk
            rm -f build_output_apks/temp_debug.apk
            $APKSIGNER verify --verbose build_output_apks/Amiberry-v5-TabS8-Debug.apk
          fi

          # 2. Sign Release APK
          RAW_RELEASE=$(find . -path "*/outputs/apk/release/*release*.apk" 2>/dev/null | head -n 1)
          if [ -n "$RAW_RELEASE" ] && [ -f "$RAW_RELEASE" ]; then
            echo "Processing Release APK: $RAW_RELEASE"
            $ZIPALIGN -p -f -v 4 "$RAW_RELEASE" build_output_apks/temp_rel.apk
            $APKSIGNER sign --ks ~/.android/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out build_output_apks/Amiberry-v5-TabS8-Release.apk build_output_apks/temp_rel.apk
            rm -f build_output_apks/temp_rel.apk
            $APKSIGNER verify --verbose build_output_apks/Amiberry-v5-TabS8-Release.apk
          fi

          echo "=== Verified Installable APKs Ready ==="
          ls -la build_output_apks/

      - name: "Upload Amiberry APK Release Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: amiberry-arm64-samsung-tab-s8-apks
          path: build_output_apks/*.apk
          retention-days: 30
