name: "Build Amiberry Android APK"

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'Release'
        type: choice
        options:
          - 'Release'
          - 'Debug'
      enable_jit:
        description: 'Enable ARM64 JIT Engine'
        required: true
        default: true
        type: boolean
  push:
    branches:
      - master
      - main
      - preview
      - release-*

jobs:
  build-android-apk:
    name: "Build Android ARM64-v8a APK"
    runs-on: ubuntu-22.04

    steps:
      - name: "Checkout Amiberry Repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "Set up Java JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Set up Android SDK & NDK"
        uses: android-actions/setup-android@v3

      - name: "Install Android NDK (r25c) & CMake"
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: "Install Host Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libxml2-dev libpng-dev libmpg123-dev libflac-dev

      - name: "Apply Android Compatibility Patches"
        run: |
          # 1. Patch missing C++ headers in amiberry.cpp and sysdeps
          if [ -f "src/osdep/amiberry.cpp" ]; then
            echo "#include <unordered_map>" > temp_hdr.txt
            echo "#include <functional>" >> temp_hdr.txt
            echo "#include <string>" >> temp_hdr.txt
            cat src/osdep/amiberry.cpp >> temp_hdr.txt
            mv temp_hdr.txt src/osdep/amiberry.cpp
            echo "Patched src/osdep/amiberry.cpp"
          fi

          if [ -f "src/include/sysdeps.h" ]; then
            echo "#include <unordered_map>" > temp_sysdeps.txt
            echo "#include <functional>" >> temp_sysdeps.txt
            cat src/include/sysdeps.h >> temp_sysdeps.txt
            mv temp_sysdeps.txt src/include/sysdeps.h
            echo "Patched src/include/sysdeps.h"
          fi

          # 2. Provide posix_spawn stubs for Android in amiberry_update.cpp
          if [ -f "src/osdep/amiberry_update.cpp" ]; then
            echo "#include <unistd.h>" > temp_upd.txt
            echo "static inline int posix_spawn(void* a, const char* b, void* c, void* d, char* const e[], char* const f[]) { return -1; }" >> temp_upd.txt
            echo "static inline int posix_spawnp(void* a, const char* b, void* c, void* d, char* const e[], char* const f[]) { return -1; }" >> temp_upd.txt
            cat src/osdep/amiberry_update.cpp >> temp_upd.txt
            mv temp_upd.txt src/osdep/amiberry_update.cpp
            sed -i 's|<spawn.h>|<unistd.h>|g' src/osdep/amiberry_update.cpp 2>/dev/null || true
            echo "Patched src/osdep/amiberry_update.cpp with posix_spawn stub"
          fi

          # 3. Patch AndroidManifest.xml and build.gradle for Android 12+ (Samsung Tab S8)
          find . -name "AndroidManifest.xml" -not -path "*/build/*" | while read -r manifest; do
            if ! grep -q "android:exported=" "$manifest"; then
              sed -i 's/<activity /<activity android:exported="true" /g' "$manifest"
            fi
            if ! grep -q "android:extractNativeLibs=" "$manifest"; then
              sed -i 's/<application /<application android:extractNativeLibs="true" /g' "$manifest"
            fi
            echo "Patched $manifest"
          done

          # Patch build.gradle to handle duplicate native library merges gracefully
          find . -name "build.gradle" -not -path "*/build/*" | while read -r gradle_file; do
            if grep -q "android {" "$gradle_file" && ! grep -q "packagingOptions" "$gradle_file"; then
              echo -e '\nandroid {\n    packagingOptions {\n        pickFirst "lib/**/*.so"\n        pickFirst "**/*.so"\n    }\n}' >> "$gradle_file"
              echo "Appended packagingOptions to $gradle_file"
            fi
          done

      - name: "Configure CMake for Android ARM64-v8a"
        env:
          INPUT_BUILD_TYPE: ${{ inputs.build_type }}
          INPUT_ENABLE_JIT: ${{ inputs.enable_jit }}
        run: |
          BUILD_TYPE="${INPUT_BUILD_TYPE:-Release}"
          ENABLE_JIT="ON"
          if [ "$INPUT_ENABLE_JIT" = "false" ]; then
            ENABLE_JIT="OFF"
          fi

          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653
          cmake -B build-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DUSE_JIT=$ENABLE_JIT \
            -DARM64_JIT=ON \
            -DENABLE_AUTO_UPDATE=OFF \
            -DCMAKE_OBJECT_PATH_MAX=1024 \
            -DUSE_OPENGL=ON \
            -DUSE_SDL2=ON

      - name: "Compile Amiberry Native Shared Library"
        env:
          INPUT_BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          BUILD_TYPE="${INPUT_BUILD_TYPE:-Release}"
          cmake --build build-android --config $BUILD_TYPE -j$(nproc)

      - name: "Stage Runtime Assets into Android Project (Fonts, Data, Configs)"
        run: |
          echo "Staging Amiberry data assets..."
          ASSETS_DIR="android/app/src/main/assets"
          if [ ! -d "android/app" ] && [ -d "app" ]; then
            ASSETS_DIR="app/src/main/assets"
          fi
          mkdir -p "$ASSETS_DIR"
          [ -d "data" ] && cp -r data "$ASSETS_DIR/" || true
          [ -d "conf" ] && cp -r conf "$ASSETS_DIR/" || true
          [ -f "amiberry.png" ] && cp amiberry.png "$ASSETS_DIR/" || true
          echo "Assets staged into $ASSETS_DIR"

      - name: "Build Android APK via Gradle"
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653

          GRADLE_DIR="."
          if [ -f "./android/gradlew" ]; then
            GRADLE_DIR="./android"
          fi

          cd $GRADLE_DIR
          chmod +x gradlew

          echo "Building Debug APK..."
          ./gradlew assembleDebug --stacktrace --no-daemon

          echo "Building Release APK..."
          ./gradlew assembleRelease --stacktrace --no-daemon || true
          cd -

          echo "=== Locate All Generated APK Files ==="
          find . -name "*.apk" -ls

      - name: "Align & Sign Installable APKs for Samsung Galaxy Tab S8"
        run: |
          mkdir -p output_apks

          # Find Android Build Tools apksigner & zipalign
          BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools/ -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

          # Ensure keystore exists for signing
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Find and process any and all APKs produced by Gradle
          find . -name "*.apk" -not -path "*/output_apks/*" | while read -r apk_path; do
            APK_NAME=$(basename "$apk_path")
            echo "Found APK: $apk_path ($APK_NAME)"
            
            # Align and sign with v1, v2, v3
            TEMP_ALIGNED="output_apks/aligned_${APK_NAME}"
            FINAL_APK="output_apks/Amiberry-TabS8-${APK_NAME}"
            
            $ZIPALIGN -p -f -v 4 "$apk_path" "$TEMP_ALIGNED" 2>/dev/null || cp "$apk_path" "$TEMP_ALIGNED"
            $APKSIGNER sign --ks ~/.android/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$FINAL_APK" "$TEMP_ALIGNED" 2>/dev/null || cp "$TEMP_ALIGNED" "$FINAL_APK"
            rm -f "$TEMP_ALIGNED"
            
            $APKSIGNER verify --verbose "$FINAL_APK" || true
            echo "Produced installable APK: $FINAL_APK"
          done

          # Direct fallback copy if signing failed or produced nothing
          if [ -z "$(ls -A output_apks/*.apk 2>/dev/null)" ]; then
            echo "Fallback: Copying raw APKs directly..."
            find . -name "*.apk" -not -path "*/output_apks/*" | while read -r raw_apk; do
              cp "$raw_apk" output_apks/
            done
          fi

          echo "=== Final APKs Ready for Samsung Tab S8 ==="
          ls -lh output_apks/

      - name: "Upload Amiberry Android APK Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: amiberry-android-arm64-samsung-tab-s8-apks
          path: output_apks/*.apk
          retention-days: 30
